name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 强制指定 Cordova 项目的工作目录（假设 config.xml 在仓库根目录）
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6 # 升级以适配 Node 24

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # 升级到 v5 消除弃用警告
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v5 # 升级以适配 Node 24
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android Platform
        run: cordova platform add android@12

      - name: Build Debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v6 # 升级以适配 Node 24
        with:
          name: shiguangju-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
